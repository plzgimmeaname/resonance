<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Resonance admin</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">resonance <span class="tag">admin</span></div>
    <nav id="tabs" hidden>
      <a href="/admin/overview">Overview</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/usage">Usage</a>
      <a href="/admin/settings">Settings</a>
      <a href="/admin/tools">Tools</a>
      <span id="ind"></span>
    </nav>
    <a href="/" class="ghost" style="text-decoration:none;margin-left:auto">← site</a>
    <button class="ghost" id="signout" hidden>Sign out</button>
  </header>
  <main>
    <div id="banner" class="banner" hidden></div>
    <!-- the current page from admin/pages/ goes here -->
    <div id="page"></div>
  </main>

  <!-- templates used by more than one page -->
  <template id="t-stat">
    <div class="stat"><div class="n" data-slot="n">0</div><div class="l" data-slot="l"></div></div>
  </template>

  <template id="t-bar">
    <div class="bar" data-slot="bar"><div class="name" data-slot="name"></div><div class="track"><div class="fill" data-slot="fill"></div></div><div class="v" data-slot="v"></div></div>
  </template>

  <template id="t-err">
    <div class="rank"><div class="t"><div data-slot="detail"></div><div data-slot="when"></div></div></div>
  </template>

  <script type="module" src="/admin/main.js"></script>
</body>
</html>
