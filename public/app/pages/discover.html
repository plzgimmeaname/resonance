<section class="view">
  <div class="row">
    <h1>Discover</h1>
    <div id="mode" class="seg">
      <button data-mode="similar">Similar</button>
      <button data-mode="now">Right now</button>
      <button data-mode="adventurous">Adventurous</button>
      <button data-mode="deepcuts">Deep cuts</button>
    </div>
    <button class="ghost" id="refresh"><svg class="ic" aria-hidden="true"><use href="/icons.svg#shuffle"/></svg>Shuffle</button>
    <button class="ghost" id="save-pl"><svg class="ic" aria-hidden="true"><use href="/icons.svg#plus"/></svg>Save as playlist</button>
  </div>
  <div id="vibe-box" class="row" hidden>
    <label class="field"><svg class="ic" aria-hidden="true"><use href="/icons.svg#sparkle"/></svg><input id="vibe" type="text" maxlength="200" placeholder="Describe a vibe, like rainy sunday coding" aria-label="Describe a vibe"></label>
    <button class="btn" id="vibe-go">Make playlist</button>
  </div>
  <div id="recs" class="grid"></div>
</section>
