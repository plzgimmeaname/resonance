<section class="view">
  <div class="row">
    <h1>Your feed</h1>
    <button class="ghost" id="notify" hidden><svg class="ic" aria-hidden="true"><use href="/icons.svg#bell"/></svg>Release alerts</button>
    <button class="ghost" id="autoplay"></button>
    <button class="ghost" id="refresh"><svg class="ic" aria-hidden="true"><use href="/icons.svg#refresh"/></svg>Refresh</button>
  </div>
  <div id="feed-filters" class="chips filters" role="toolbar" aria-label="Filter the feed"></div>
  <div class="feed-wrap">
    <div id="feed" class="feed reels" tabindex="0" aria-label="Feed, use j and k to move between cards"></div>
    <div class="reel-pos" id="reel-pos" aria-hidden="true"></div>
  </div>

  <template id="t-filter"><button class="chip" data-slot="chip"></button></template>

  <template id="t-insight">
    <div class="item insight"><div class="why">Insight</div><div class="title" data-slot="title"></div><div class="by" data-slot="body"></div></div>
  </template>

  <template id="t-release">
    <div class="item">
      <slot name="cover"></slot>
      <div class="meta"><div class="why" data-slot="why"></div><div class="title" data-slot="title"></div><div class="by" data-slot="by"></div></div>
      <div class="actions"><a class="ghost" data-slot="open" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="/icons.svg#external"/></svg>Open in Spotify</a></div>
    </div>
  </template>

  <template id="t-track">
    <div class="item">
      <slot name="cover"></slot>
      <div class="meta"><div class="why" data-slot="why"></div><div class="title" data-slot="title"></div><div class="by" data-slot="by"></div></div>
      <slot name="actions"></slot>
    </div>
  </template>
</section>
