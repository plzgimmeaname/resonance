<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0f13">
  <title>Resonance</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">resonance</div>
    <nav id="tabs" hidden>
      <a href="/feed">Feed</a>
      <a href="/stats">Stats</a>
      <a href="/discover">Discover</a>
      <a href="/concerts" id="tab-concerts" hidden>Concerts</a>
      <a href="/blend">Blend</a>
      <span id="ind"></span>
    </nav>
    <div id="account" hidden>
      <img id="me-img" alt="" hidden><span id="me-name"></span>
      <button id="logout">sign out</button><button id="delete-me">delete my data</button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>
    <!-- the current page from app/pages/ goes here -->
    <div id="page"></div>
  </main>

  <div id="pl-modal" class="modal" hidden>
    <div class="panel">
      <div class="row"><h3 style="margin:0;margin-right:auto">Add to playlist</h3><button class="ghost" id="pl-close">✕</button></div>
      <div id="pl-list"></div>
    </div>
  </div>

  <!-- templates used by more than one page -->
  <template id="t-actions">
    <div class="actions">
      <button class="play" data-slot="preview">▶ Preview</button>
      <button class="play add-btn" data-slot="add">＋ Playlist</button>
      <a class="open" data-slot="open" target="_blank" rel="noopener">Open ↗</a>
      <button class="vote" data-vote="1" data-slot="up" title="More like this">👍</button>
      <button class="vote" data-vote="-1" data-slot="down" title="Less like this">👎</button>
      <button class="play why-btn" data-slot="why">Why?</button>
    </div>
  </template>

  <template id="t-tile">
    <div class="tile"><slot name="cover"></slot><div class="title" data-slot="title"></div><div class="by" data-slot="by"></div><div class="why" data-slot="why"></div><slot name="actions"></slot></div>
  </template>

  <template id="t-event">
    <div class="item event">
      <div class="meta"><div class="why">Live · <slot name="artist"></slot></div><div class="title" data-slot="name"></div><div class="by" data-slot="where"></div></div>
      <div class="actions"><a class="open" data-slot="tickets" target="_blank" rel="noopener">Tickets ↗</a></div>
    </div>
  </template>

  <template id="t-pl">
    <button class="pl"><slot name="cover"></slot><span><slot name="name"></slot><br><small style="color:var(--muted)"><slot name="tracks"></slot> tracks</small></span></button>
  </template>

  <template id="t-bar">
    <div class="bar" data-slot="bar"><div class="name" data-slot="name"></div><div class="track"><div class="fill" data-slot="fill"></div></div><div class="v" data-slot="v"></div></div>
  </template>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
