<section class="view">
  <div class="auth-card">
    <h1 id="auth-title">Admin sign-in</h1>
    <p class="sub" id="auth-sub">Enter the admin password.</p>
    <form id="auth-form">
      <input id="auth-code" placeholder="Setup code from the terminal" autocomplete="off" hidden>
      <input id="auth-pw" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" type="submit">Continue</button>
    </form>
  </div>
</section>
